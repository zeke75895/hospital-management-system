spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hospital}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:hospital}
    password: ${DB_PASSWORD:}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    # TODO: switch to Flyway/Liquibase migrations and set this to `validate`
    # before this ever points at a real prod database.
    hibernate:
      ddl-auto: update
    show-sql: false

logging:
  level:
    org.hibernate.SQL: warn
