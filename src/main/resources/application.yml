spring:
  application:
    name: hospital-management-system
  profiles:
    active: dev
  data:
    web:
      pageable:
        # Raw PageImpl serialization isn't a stable JSON contract (Spring Data logs a warning
        # if you return Page<T> from a controller without this). via-dto uses the documented
        # {content, page: {size, number, totalElements, totalPages}} shape instead - relevant
        # now that PatientController.getPatientHistory actually returns a Page over HTTP.
        serialization-mode: via-dto

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

server:
  port: 8080

jwt:
  # Dev-only default - HS256 needs >= 256 bits once UTF-8 encoded, so this is deliberately long.
  # Prod MUST override via the JWT_SECRET env var with a real, non-committed secret; never rely
  # on this fallback outside local dev, same treatment as DB_PASSWORD in application-prod.yml.
  secret: ${JWT_SECRET:dev-only-change-me-hospital-jwt-secret-please-override-in-prod}
  expiration-ms: 3600000 # 1 hour
